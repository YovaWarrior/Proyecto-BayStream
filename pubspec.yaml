name: baystream
description: Aplicación de gestión de carga marítima - Parser BAPLIE 2.2.1
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.1.0
  
  # Firebase / sincronización Offline-First
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  # Cuentas de RF-034 (T-79, autorizada en 2.7). Fija en la versión que T-70
  # y T-70c probaron con firebase_core 4.13.0 y cloud_firestore 6.8.0.
  firebase_auth: 6.5.7
  # Directa desde T-79 (autorizada en 10.3): huella SHA-256 de las fuentes
  # publicadas. Fija en la versión que ya traía el lock como transitiva.
  crypto: 3.0.7

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.3.3
  file_picker: ^10.3.10
  # RF-041 (T-94): dictado breve en el muelle. Fija y compatible con el SDK
  # actual; sin el soporte inicial de Windows introducido en 7.3.
  speech_to_text: 7.2.0

  # Generación de reportes PDF multiplataforma (RF-025)
  pdf: 3.12.0

  # Almacén local RF-031+ (T-35): cinco exportaciones A01 superan 5 MiB.
  hive_ce: 2.20.0

  # Listado de la agencia en Excel (T-73, RF-038; autorizado en 2.7 de SPRINT-3).
  # Dart puro, también en Web. Fija: es la última que resuelve con archive 4
  # y xml 6, que exigen pdf e image.
  excel_community: 1.0.10
  # Directa desde T-73 (autorizada en 2.7): el lector vuelve relativas las
  # rutas absolutas de workbook.xml.rels, que excel_community no resuelve.
  # Fija en la versión que ya traía el lock por pdf e image.
  archive: 4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Arnés de rendimiento de T-99 (autorizado en 2.7 de SPRINT-3, 10.83). Del
  # propio SDK y solo de desarrollo: no entra en la app compilada.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Instalador MSIX de Windows (T-93, autorizado en 2.7 de SPRINT-3). Fija y
  # solo de desarrollo: no entra en la app compilada.
  msix: 3.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Medium.ttf

# Instalador de Windows (T-93). Sin secretos: la huella del certificado llega por
# la linea de comandos en tool/t93_msix.ps1 (--signtool-options). Nombres de las
# opciones confirmados en lib/src/configuration.dart de msix 3.18.0.
msix_config:
  display_name: BayStream
  publisher_display_name: Carlos Martínez
  identity_name: gt.cmartinez.baystream
  # Exactamente el sujeto del certificado autofirmado de Carlos.
  publisher: CN=BayStream
  msix_version: 1.0.0.0
  # Solo red saliente. Sin microfono: en Windows no hay voz (T-94).
  capabilities: internetClient
  # T-88 (10.50): el PNG de 512; msix lee del .ico solo el cuadro de 16 px.
  logo_path: web/icons/Icon-512.png
  # El paquete se arma sobre la compilacion Release hecha antes con las
  # definiciones de Firebase, nunca con una compilacion propia sin ellas.
  build_windows: false
  # La herramienta no toca los almacenes de certificados: eso lo hace Carlos.
  install_certificate: false
  output_path: build/t93
  output_name: BayStream
