<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  digito(codigo) {
    var v = { A: 10, B: 12, C: 13, D: 14, E: 15, F: 16, G: 17, H: 18, I: 19, J: 20, K: 21, L: 23, M: 24, N: 25, O: 26, P: 27, Q: 28, R: 29, S: 30, T: 31, U: 32, V: 34, W: 35, X: 36, Y: 37, Z: 38 };
    var suma = 0;
    for (var i = 0; i < 10; i++) {
      var ch = codigo.charAt(i);
      var n = (ch >= '0' && ch <= '9') ? Number(ch) : v[ch];
      suma += n * Math.pow(2, i);
    }
    return String((suma % 11) % 10);
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var ov = st.ov || {};
    var ultimo = ('ultimo' in st) ? st.ultimo : 'm-86-6';
    var FILAS = ['04', '02', '00', '01', '03'];
    var COLS = [3, 4, 5, 6, 7];
    var CODIGOS = { U: 'USHOU', P: 'PAMIT', K: 'JMKCT' };
    var CUBIERTA = [
      ['88', 0, 'x x x x x'],
      ['86', 1, 'G G* G x G'],
      ['84', 2, 'Gv K G G Gr'],
      ['82', 3, 'P K K U U']
    ];
    var BODEGA = [
      ['10', 4, 'U Gr G U G']
    ];
    var SERIES = { 'm-86-6': '004218', 'm-86-4': '000110', 'm-84-7': '020493' };
    var hechosAntes = 0;
    var hechosAhora = 0;
    var porNumero = {};

    function serie(id, fila, col) {
      var n = fila * 11 + col + 1;
      return SERIES[id] || ('000000' + ((n * 7349 + 30011) % 1000000)).slice(-6);
    }

    function filaVista(def, bodegaFila) {
      var toks = def[2].split(' ');
      var cells = toks.map(function (tok, i) {
        var col = COLS[i];
        var id = 'm-' + def[0] + '-' + col;
        var celda = '014-' + FILAS[i] + '-' + def[0];
        var p = tok.charAt(0);
        var gtstc = (p === 'G' || p === 'x');
        var live = tok.indexOf('*') >= 0;
        var reefer = tok.indexOf('r') >= 0;
        var vacio = tok.indexOf('v') >= 0;
        var s = serie(id, def[1], col);
        var numero = 'TSTU ' + s + ' ' + self.digito('TSTU' + s);
        porNumero[id] = numero + ' · ' + celda;
        if (!gtstc) {
          return {
            hay: true, slot: '', cls: '', z: 1, flecha: false, check: false, esPaso: true, reefer: false, vacio: false,
            code: CODIGOS[p], label: 'Paso', bg: '#E9EEF5', fg: '#4A5B73', bd: '#C9D3E0', sh: 'none', tf: 'none',
            aria: 'Celda ' + celda + ', ' + CODIGOS[p] + ', de paso',
            tap: function () {}
          };
        }
        var base = (p === 'x') ? 'hecho' : (live ? 'bajando' : 'baja');
        if (base === 'hecho') hechosAntes += 1;
        var estado = ov[id] || base;
        if (estado === 'hecho') hechosAhora += 1;
        var tap = function () {
          if (estado === 'hecho') return;
          var nuevo = {};
          for (var k in ov) { nuevo[k] = ov[k]; }
          nuevo[id] = 'hecho';
          self.setState({ ov: nuevo, ultimo: id });
        };
        if (estado === 'hecho') {
          return {
            hay: true, slot: '', cls: '', z: 1, flecha: false, check: true, esPaso: false, reefer: reefer, vacio: vacio,
            code: '', label: 'Hecho', bg: '#DDF3E6', fg: '#145C36', bd: '#9AD3B0', sh: 'none', tf: 'none',
            aria: 'Celda ' + celda + ', bajado', tap: tap
          };
        }
        if (estado === 'bajando') {
          return {
            hay: true, slot: 'border: 1.5px dashed #C2410C;', cls: 'bs-lift', z: 3, flecha: true, check: false, esPaso: false, reefer: reefer, vacio: vacio,
            code: '', label: 'Bajando', bg: '#FF7A1A', fg: '#0E2240', bd: '#C2410C', sh: '0 0 0 3px #F3F6FB, 0 10px 22px rgba(194,65,12,0.35)', tf: 'translateY(-12px)',
            aria: 'Celda ' + celda + ', la grúa lo está bajando. Toca para confirmar en el muelle', tap: tap
          };
        }
        return {
          hay: true, slot: '', cls: '', z: 1, flecha: true, check: false, esPaso: false, reefer: reefer, vacio: vacio,
          code: '', label: 'Baja', bg: bodegaFila ? '#1F5FD6' : '#0D47A1', fg: '#FFFFFF', bd: bodegaFila ? '#1F5FD6' : '#0D47A1', sh: 'none', tf: 'none',
          aria: 'Celda ' + celda + ', por bajar. Toca para registrar la descarga', tap: tap
        };
      });
      return { label: def[0], cells: cells };
    }

    var cubierta = CUBIERTA.map(function (d) { return filaVista(d, false); });
    var bodega = BODEGA.map(function (d) { return filaVista(d, true); });

    var delta = hechosAhora - hechosAntes;
    var hechas = 120 + delta;
    var porBajar = 150 - hechas;
    var pct = Math.round(hechas / 150 * 100);
    var enBahia = 0;
    cubierta.concat(bodega).forEach(function (f) { f.cells.forEach(function (c) { if (c.label === 'Baja' || c.label === 'Bajando') enBahia += 1; }); });

    return {
      filas: FILAS,
      cubierta: cubierta,
      bodega: bodega,
      hayAviso: !!ultimo,
      aviso: ultimo ? porNumero[ultimo] : '',
      deshacer: function () {
        if (!ultimo) return;
        var nuevo = {};
        for (var k in ov) { nuevo[k] = ov[k]; }
        nuevo[ultimo] = (ultimo === 'm-86-4') ? 'bajando' : 'baja';
        self.setState({ ov: nuevo, ultimo: null });
      },
      porBajar: String(porBajar),
      hechas: String(hechas),
      avancePct: pct + '%',
      avanceTexto: 'Descarga ' + pct + ' %',
      resumenBahia: enBahia + ' por bajar a la vista'
    };
  }
}
</script>
